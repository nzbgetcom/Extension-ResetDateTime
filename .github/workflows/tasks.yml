name: extension tasks

on:
  push:
    branches:
    - master
    tags:
    - "v*"
  pull_request:
    branches:
    - master

jobs:
  manifest:
    uses: nzbgetcom/nzbget-extensions/.github/workflows/manifest.yml@main

  tests:
    uses: nzbgetcom/nzbget-extensions/.github/workflows/python-tests.yml@main
    with:
      python-versions: "3.8 3.9 3.10 3.11 3.12 3.13 3.14"
      supported-python-versions: "3.8 3.9 3.10 3.11 3.12 3.13 3.14"
      test-script: tests.py
      debug: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [manifest, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Writes build/resetdatetime-<version>-dist.zip and its .sha256
    - name: Build
      run: ./build-extension.sh

    - name: Check the archive
      run: |
        set -euo pipefail
        version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
        test "v${version}" = "${GITHUB_REF_NAME}"
        unzip -l "build/resetdatetime-${version}-dist.zip" | grep "ResetDateTime/manifest.json"
        unzip -l "build/resetdatetime-${version}-dist.zip" | grep "ResetDateTime/_locales/"
        if [ -n "$(find build/ResetDateTime \( -name '__pycache__' -o -name '*.pyc' \) -print -quit)" ]; then
            echo "bytecode left in the archive"
            exit 1
        fi

    - uses: ncipollo/release-action@v1
      with:
        artifacts: "build/*-dist.zip,build/*.sha256"
